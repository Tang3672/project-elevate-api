name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pip-audit

      - name: Run tests (regression gate)
        env:
          ANTHROPIC_API_KEY: ""   # unit tests are pure / mocked; integration tests self-skip
        run: pytest tests/ -q --cov=app --cov-report=term-missing

      - name: Dependency vulnerability scan
        # Informational for now (existing deps may carry advisories); never blocks the
        # build. Tighten to a failing gate once the dependency tree is clean.
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc
